<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101619">
  <title>競技場突圍</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      background: #090615;
      color: #f7f0ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: #090615;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .hud-panel {
      position: absolute;
      top: 24px;
      padding: 14px 18px;
      border: 1px solid #c965ff3d;
      border-radius: 12px;
      background: #100b20e8;
      backdrop-filter: blur(8px);
    }

    #health-panel { left: 24px; width: 210px; }
    #enemy-panel { right: 24px; text-align: right; }
    #status-panels {
      position: absolute;
      top: 24px;
      left: 50%;
      display: flex;
      gap: 8px;
      transform: translateX(-50%);
    }

    #status-panels .hud-panel {
      position: static;
      min-width: 76px;
      text-align: center;
    }

    .hud-label {
      display: block;
      margin-bottom: 8px;
      color: #9eafbf;
      font-size: 12px;
      letter-spacing: .14em;
    }

    #health-track {
      height: 8px;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff20;
    }

    #health-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #24cbe8, #a5f8ff);
      transition: width .18s ease, background .18s ease;
    }

    #health-value, #enemy-count, #score-value, #wave-value {
      display: block;
      margin-top: 7px;
      font-size: 20px;
      font-weight: 700;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before, #crosshair::after {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      content: "";
      border-radius: 2px;
      background: #f5eaff;
      box-shadow: 0 0 8px #ff42d6, 0 0 16px #36dff5;
      transform: translate(-50%, -50%);
    }

    #crosshair::before { width: 2px; height: 18px; }
    #crosshair::after { width: 18px; height: 2px; }

    #scope {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 49.82%, #ffcadf 49.82%, #ffcadf 50.18%, transparent 50.18%) center / 100% 1px no-repeat,
        linear-gradient(0deg, transparent 49.82%, #ffcadf 49.82%, #ffcadf 50.18%, transparent 50.18%) center / 1px 100% no-repeat;
    }

    #scope.active {
      display: block;
      background:
        linear-gradient(90deg, transparent 49.82%, #ffcadf 49.82%, #ffcadf 50.18%, transparent 50.18%) center / 100% 1px no-repeat,
        linear-gradient(0deg, transparent 49.82%, #ffcadf 49.82%, #ffcadf 50.18%, transparent 50.18%) center / 1px 100% no-repeat,
        radial-gradient(circle at center,
          transparent 0,
          transparent 24vmin,
          #090615 24.2vmin,
          #090615 100%);
    }

    #scope::before {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48vmin;
      height: 48vmin;
      border: 2px solid #ff76df;
      border-radius: 50%;
      box-shadow: 0 0 18px #ff35c88c, inset 0 0 12px #ff35c848;
      content: "";
      transform: translate(-50%, -50%);
    }

    #scope::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      border: 1px solid #ffffff;
      border-radius: 50%;
      background: #ff405f;
      box-shadow: 0 0 8px #ff405f;
      content: "";
      transform: translate(-50%, -50%);
    }

    #weapon-panel {
      position: absolute;
      right: 24px;
      bottom: 68px;
      width: 150px;
      height: 150px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: right;
    }

    #weapon-name {
      display: block;
      color: #ff76df;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    #ammo-value {
      display: block;
      margin-top: 7px;
      font-size: 22px;
      font-weight: 800;
    }

    #reload-status {
      display: block;
      min-height: 16px;
      margin-top: 5px;
      color: #9eafbf;
      font-size: 12px;
    }

    #help {
      position: absolute;
      bottom: 20px;
      left: 50%;
      padding: 9px 14px;
      border-radius: 8px;
      background: #100b20e8;
      color: #d3c4e7;
      font-size: 13px;
      white-space: nowrap;
      transform: translateX(-50%);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #101715b8, #22271fb3);
    }

    #card {
      width: min(460px, 100%);
      padding: 36px;
      border: 1px solid #fb55dc66;
      border-radius: 18px;
      background: #130d25f2;
      box-shadow: 0 24px 90px #000a, 0 0 40px #d733b51c;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #ff76df;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      letter-spacing: .06em;
    }

    #overlay-copy {
      margin: 16px 0 24px;
      color: #adbdcd;
      line-height: 1.8;
    }

    #primary-action {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(100deg, #ff4ecb, #9d68ff);
      color: #15081c;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: filter .15s ease, transform .15s ease;
    }

    #primary-action:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .small-note {
      margin: 16px 0 0;
      color: #9c8aaf;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      .hud-panel { top: 12px; padding: 10px 12px; }
      #health-panel { left: 12px; width: 160px; }
      #enemy-panel { right: 12px; }
      #status-panels { top: 84px; left: 12px; transform: none; }
      #weapon-panel { right: 12px; bottom: 54px; width: 130px; height: 130px; }
      #help { bottom: 12px; font-size: 11px; }
      #card { padding: 28px 22px; }
    }
  </style>
</head>
<body>
  <main id="game" aria-label="競技場突圍 3D 射擊遊戲">
    <section id="hud" aria-live="polite">
      <div id="health-panel" class="hud-panel">
        <span class="hud-label">生命值</span>
        <div id="health-track"><div id="health-fill"></div></div>
        <span id="health-value">100</span>
      </div>
      <div id="enemy-panel" class="hud-panel">
        <span class="hud-label">剩餘敵人</span>
        <span id="enemy-count">0</span>
      </div>
      <div id="status-panels">
        <div id="wave-panel" class="hud-panel">
          <span class="hud-label">波次</span>
          <span id="wave-value">0 / 3</span>
        </div>
        <div id="score-panel" class="hud-panel">
          <span class="hud-label">分數</span>
          <span id="score-value">0</span>
        </div>
      </div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="scope" aria-hidden="true"></div>
      <div id="weapon-panel" class="hud-panel">
        <span class="hud-label">武器</span>
        <span id="weapon-name">手槍</span>
        <span id="ammo-value">12 / 48</span>
        <span id="reload-status"></span>
      </div>
      <div id="help">WASD 移動 · 滑鼠瞄準 · 左鍵射擊（步槍按住連發） · R 換彈 · 滾輪切槍 · Shift 衝刺 · Esc 暫停</div>
    </section>

    <section id="overlay">
      <div id="card">
        <p class="eyebrow">3D FIRST-PERSON SHOOTER</p>
        <h1 id="overlay-title">競技場突圍</h1>
        <p id="overlay-copy">完成三波敵人攻勢。<br>瞄準、移動，並活下來。</p>
        <button id="primary-action" type="button">進入競技場</button>
        <p class="small-note">建議使用電腦與滑鼠遊玩；點擊開始後會鎖定滑鼠視角。</p>
      </div>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";

    const game = document.querySelector("#game");
    const hud = document.querySelector("#hud");
    const healthFill = document.querySelector("#health-fill");
    const healthValue = document.querySelector("#health-value");
    const enemyCount = document.querySelector("#enemy-count");
    const scoreValue = document.querySelector("#score-value");
    const waveValue = document.querySelector("#wave-value");
    const weaponName = document.querySelector("#weapon-name");
    const ammoValue = document.querySelector("#ammo-value");
    const reloadStatus = document.querySelector("#reload-status");
    const crosshair = document.querySelector("#crosshair");
    const scope = document.querySelector("#scope");
    const overlay = document.querySelector("#overlay");
    const overlayTitle = document.querySelector("#overlay-title");
    const overlayCopy = document.querySelector("#overlay-copy");
    const primaryAction = document.querySelector("#primary-action");
    const helpText = document.querySelector("#help");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x554264);
    scene.fog = new THREE.Fog(0x303b36, 36, 76);
    const arenaSize = 48;
    const arenaHalfSize = arenaSize / 2;
    const arenaScale = arenaSize / 40;

    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
    camera.rotation.order = "YXZ";
    camera.position.set(0, 1.65, arenaHalfSize * 0.5);
    scene.add(camera);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(90, 32, 20),
      new THREE.ShaderMaterial({
        uniforms: {
          zenithColor: { value: new THREE.Color(0x344c79) },
          middleColor: { value: new THREE.Color(0xa86170) },
          horizonColor: { value: new THREE.Color(0xf19a69) },
          sunColor: { value: new THREE.Color(0xffd49a) },
          sunDirection: { value: new THREE.Vector3(-0.32, 0.14, -1).normalize() }
        },
        vertexShader: `
          varying vec3 vSkyDirection;
          void main() {
            vSkyDirection = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vSkyDirection;
          uniform vec3 zenithColor;
          uniform vec3 middleColor;
          uniform vec3 horizonColor;
          uniform vec3 sunColor;
          uniform vec3 sunDirection;
          void main() {
            vec3 direction = normalize(vSkyDirection);
            float height = max(direction.y, 0.0);
            vec3 color = mix(horizonColor, middleColor, smoothstep(0.0, 0.34, height));
            color = mix(color, zenithColor, smoothstep(0.28, 0.9, height));
            float sunAmount = max(dot(direction, normalize(sunDirection)), 0.0);
            color += sunColor * pow(sunAmount, 28.0) * 0.55;
            color = mix(color, sunColor, smoothstep(0.9994, 0.9998, sunAmount));
            gl_FragColor = vec4(color, 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
        side: THREE.BackSide,
        depthTest: false,
        depthWrite: false
      })
    );
    sky.renderOrder = -1;
    scene.add(sky);
    sky.position.copy(camera.position);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    game.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd0dfd5, 0x48483b, 2.8));
    const keyLight = new THREE.DirectionalLight(0xffbd8f, 3);
    keyLight.position.set(-5, 7, -12);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);
    for (const [x, z, color] of [
      [-14 * arenaScale, -14 * arenaScale, 0xffa64d],
      [14 * arenaScale, -14 * arenaScale, 0x55c9bd],
      [-14 * arenaScale, 14 * arenaScale, 0x55c9bd],
      [14 * arenaScale, 14 * arenaScale, 0xffa64d]
    ]) {
      const light = new THREE.PointLight(color, 12, 32, 2);
      light.position.set(x, 3.2, z);
      scene.add(light);
    }
    for (const x of [-9, 0, 9]) {
      const workLight = new THREE.PointLight(0xffe8c5, 16, 20, 2);
      workLight.position.set(x, 3.7, 0);
      scene.add(workLight);
    }

    const neonCyan = new THREE.MeshBasicMaterial({ color: 0x55c9bd });
    const neonPink = new THREE.MeshBasicMaterial({ color: 0xffa64d });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x4b514c,
      roughness: 0.82,
      metalness: 0.32
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(arenaSize, arenaSize), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    const floorGrid = new THREE.GridHelper(arenaSize, arenaSize / 2, 0x95814e, 0x525a54);
    floorGrid.position.y = 0.01;
    scene.add(floorGrid);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x505953,
      emissive: 0x171b18,
      roughness: 0.82,
      metalness: 0.38
    });
    const worldBlockers = [];
    const arenaObstacles = [];
    const wallTrimGeometry = new THREE.BoxGeometry(arenaSize - 1, 0.055, 0.08);
    const sideTrimGeometry = new THREE.BoxGeometry(0.08, 0.055, arenaSize - 1);
    const wallGeometry = new THREE.BoxGeometry(arenaSize, 4, 0.7);
    for (const z of [-arenaHalfSize, arenaHalfSize]) {
      const wall = new THREE.Mesh(wallGeometry, wallMaterial);
      wall.position.set(0, 2, z);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      worldBlockers.push(wall);
      for (const y of [0.18, 3.82]) {
        const trim = new THREE.Mesh(wallTrimGeometry, z < 0 ? neonCyan : neonPink);
        trim.position.set(0, y, z < 0 ? z + 0.45 : z - 0.45);
        scene.add(trim);
      }
    }
    const sideWallGeometry = new THREE.BoxGeometry(0.7, 4, arenaSize);
    for (const x of [-arenaHalfSize, arenaHalfSize]) {
      const wall = new THREE.Mesh(sideWallGeometry, wallMaterial);
      wall.position.set(x, 2, 0);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
      worldBlockers.push(wall);
      for (const y of [0.18, 3.82]) {
        const trim = new THREE.Mesh(sideTrimGeometry, x < 0 ? neonPink : neonCyan);
        trim.position.set(x < 0 ? x + 0.45 : x - 0.45, y, 0);
        scene.add(trim);
      }
    }

    const pillarMaterial = new THREE.MeshStandardMaterial({
      color: 0x626963,
      emissive: 0x222621,
      roughness: 0.74,
      metalness: 0.58
    });
    const pillarGeometry = new THREE.BoxGeometry(1.2, 3, 1.2);
    for (const [x, z] of [[-7, -7], [7, -7], [-7, 7], [7, 7]]) {
      const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
      pillar.position.set(x, 1.5, z);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      scene.add(pillar);
      worldBlockers.push(pillar);
      arenaObstacles.push({ x, z, halfX: 0.6, halfZ: 0.6 });
      for (const y of [0.42, 2.58]) {
        const trim = new THREE.Mesh(new THREE.BoxGeometry(1.24, 0.055, 0.055), (x + z) % 2 ? neonCyan : neonPink);
        trim.position.set(x, y, z + 0.61);
        scene.add(trim);
      }
    }

    const laneMarkMaterial = new THREE.MeshBasicMaterial({ color: 0xb18a42 });
    for (const x of [-3.1, 3.1]) {
      const laneMark = new THREE.Mesh(
        new THREE.BoxGeometry(0.055, 0.018, arenaSize - 3),
        laneMarkMaterial
      );
      laneMark.position.set(x, 0.025, 0);
      scene.add(laneMark);
    }

    const pipeMaterial = new THREE.MeshStandardMaterial({
      color: 0x626963,
      metalness: 0.78,
      roughness: 0.34
    });
    const wallPipeGeometry = new THREE.CylinderGeometry(0.12, 0.12, arenaSize - 3, 10);
    for (const x of [-arenaHalfSize + 0.75, arenaHalfSize - 0.75]) {
      const pipe = new THREE.Mesh(wallPipeGeometry, pipeMaterial);
      pipe.rotation.x = Math.PI / 2;
      pipe.position.set(x, 3.15, 0);
      pipe.castShadow = true;
      scene.add(pipe);
    }

    const coverMaterial = new THREE.MeshStandardMaterial({
      color: 0x70786f,
      roughness: 0.78,
      metalness: 0.3
    });
    const coverStripeMaterial = new THREE.MeshBasicMaterial({ color: 0xc98e36 });
    const coverGeometry = new THREE.BoxGeometry(2.4, 1.35, 1.1);
    const coverStripeGeometry = new THREE.BoxGeometry(2.42, 0.12, 0.04);
    for (const [x, z] of [[-4.5, -7], [4.5, -3], [-4.5, 1], [4.5, 5], [-4.5, 9], [4.5, 13]]) {
      const cover = new THREE.Mesh(coverGeometry, coverMaterial);
      cover.position.set(x, 0.675, z);
      cover.castShadow = true;
      cover.receiveShadow = true;
      scene.add(cover);
      worldBlockers.push(cover);
      arenaObstacles.push({ x, z, halfX: 1.2, halfZ: 0.55 });

      const stripe = new THREE.Mesh(coverStripeGeometry, coverStripeMaterial);
      stripe.position.set(x, 0.98, z - 0.571);
      scene.add(stripe);
    }

    const enemyBodyGeometry = new THREE.BoxGeometry(0.72, 0.82, 0.48);
    const enemyHeadGeometry = new THREE.BoxGeometry(0.58, 0.44, 0.5);
    const enemyArmorGeometry = new THREE.BoxGeometry(0.27, 0.32, 0.48);
    const enemyLimbGeometry = new THREE.BoxGeometry(0.18, 0.5, 0.2);
    const enemyLegGeometry = new THREE.BoxGeometry(0.22, 0.5, 0.28);
    const enemyVisorGeometry = new THREE.BoxGeometry(0.43, 0.1, 0.055);
    const enemyChestLightGeometry = new THREE.BoxGeometry(0.28, 0.045, 0.035);
    const enemyMaterial = new THREE.MeshStandardMaterial({
      color: 0x27253d,
      emissive: 0x110b24,
      metalness: 0.76,
      roughness: 0.3
    });
    const enemyAccentMaterial = new THREE.MeshStandardMaterial({
      color: 0x79256f,
      emissive: 0x8e145c,
      emissiveIntensity: 1.2,
      metalness: 0.52,
      roughness: 0.32
    });
    const enemyVisorMaterial = new THREE.MeshBasicMaterial({ color: 0x34efff });
    const enemyChestLightMaterial = new THREE.MeshBasicMaterial({ color: 0xff46d0 });

    const weapon = new THREE.Group();
    weapon.position.set(0.4, -0.34, -0.84);
    weapon.scale.setScalar(0.52);
    const weaponBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.16, 0.48),
      new THREE.MeshStandardMaterial({
        color: 0x58516f,
        emissive: 0x100b1f,
        metalness: 0.78,
        roughness: 0.28
      })
    );
    const weaponGrip = new THREE.Mesh(
      new THREE.BoxGeometry(0.13, 0.23, 0.16),
      new THREE.MeshStandardMaterial({ color: 0x302941, metalness: 0.56, roughness: 0.4 })
    );
    weaponGrip.position.set(0, -0.16, 0.08);
    const weaponBarrel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.055, 0.38, 8),
      new THREE.MeshStandardMaterial({ color: 0x77708f, metalness: 0.85, roughness: 0.22 })
    );
    weaponBarrel.rotation.x = Math.PI / 2;
    weaponBarrel.position.z = -0.34;
    const weaponLight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.025, 0.3), neonCyan);
    weaponLight.position.set(0, 0.09, -0.06);
    weapon.add(weaponBody, weaponGrip, weaponBarrel, weaponLight);
    camera.add(weapon);

    const weaponTypes = [
      { id: "pistol", name: "手槍", damage: 1, fireDelay: 300, magazine: 12, reserve: 48, reloadTime: 900, color: 0x20e8ff, modelScale: 0.52 },
      { id: "rifle", name: "突擊步槍", damage: 1, fireDelay: 115, magazine: 30, reserve: 120, reloadTime: 1500, color: 0xff35c8, modelScale: 0.58 },
      { id: "sniper", name: "狙擊槍", damage: 4, fireDelay: 900, magazine: 5, reserve: 20, reloadTime: 2200, color: 0xffd45c, modelScale: 0.64 }
    ];
    let currentWeaponIndex = 0;
    let isReloading = false;
    let isAiming = false;
    const ammunition = weaponTypes.map(type => ({ magazine: type.magazine, reserve: type.reserve }));
    const reloadingWeapons = weaponTypes.map(() => false);
    const reloadTimers = weaponTypes.map(() => 0);
    const player = { health: 100, yaw: 0, pitch: 0, lastDamage: 0 };
    const enemies = [];
    const bulletEffects = [];
    const bulletGeometry = new THREE.SphereGeometry(0.035, 8, 6);
    const bulletMaterials = new Map(weaponTypes.map(type => [
      type.id,
      new THREE.MeshBasicMaterial({ color: type.color, toneMapped: false })
    ]));
    const trailMaterials = new Map(weaponTypes.map(type => [
      type.id,
      new THREE.LineBasicMaterial({ color: type.color, transparent: true, opacity: 0.8, toneMapped: false })
    ]));
    const waveConfigs = [
      { enemyCount: 6, enemyHealth: 3, enemySpeed: 1.25 },
      { enemyCount: 8, enemyHealth: 3, enemySpeed: 1.45 },
      { enemyCount: 10, enemyHealth: 4, enemySpeed: 1.65 }
    ];
    const spawnPoints = [
      [-14, -14], [0, -17], [14, -14], [-17, 0], [17, 0],
      [-14, 14], [14, 14], [-18, -8], [18, -8], [0, -18]
    ].map(([x, z]) => [x * arenaScale, z * arenaScale]);
    const pressedKeys = new Set();
    const raycaster = new THREE.Raycaster();
    const centerScreen = new THREE.Vector2(0, 0);
    const clock = new THREE.Clock();
    let state = "menu";
    let lastShot = 0;
    let isFiring = false;
    let fallbackAim = false;
    let score = 0;
    let wave = 0;

    function updateHud() {
      healthValue.textContent = String(player.health);
      healthFill.style.width = `${player.health}%`;
      healthFill.style.background = player.health <= 30
        ? "linear-gradient(90deg, #ff3fbf, #ff9ae3)"
        : "linear-gradient(90deg, #24cbe8, #a5f8ff)";
      enemyCount.textContent = String(enemies.length);
      scoreValue.textContent = String(score);
      waveValue.textContent = `${wave} / ${waveConfigs.length}`;
      updateWeaponHud();
    }

    function updateWeaponHud() {
      const type = weaponTypes[currentWeaponIndex];
      const ammo = ammunition[currentWeaponIndex];
      weaponName.textContent = type.name;
      ammoValue.textContent = `${ammo.magazine} / ${ammo.reserve}`;
      reloadStatus.textContent = reloadingWeapons[currentWeaponIndex] ? "換彈中…" : "";
    }

    function updateWeaponModel() {
      const type = weaponTypes[currentWeaponIndex];
      if (type.id !== "sniper") stopAiming();
      weapon.scale.setScalar(type.modelScale);
      weapon.position.set(
        type.id === "sniper" ? 0.42 : 0.4,
        type.id === "sniper" ? -0.36 : -0.34,
        type.id === "sniper" ? -0.92 : -0.84
      );
      weaponLight.material = new THREE.MeshBasicMaterial({ color: type.color });
      weaponBarrel.scale.set(type.id === "sniper" ? 1.35 : 1, 1, type.id === "sniper" ? 1.8 : 1);
      weaponBody.scale.set(type.id === "rifle" ? 1.15 : 1, 1, type.id === "rifle" ? 1.45 : 1);
      updateWeaponHud();
    }

    function startAiming() {
      if (state !== "playing" || weaponTypes[currentWeaponIndex].id !== "sniper") return;
      isAiming = true;
      camera.fov = 75 / 3;
      camera.updateProjectionMatrix();
      scope.classList.add("active");
      crosshair.style.display = "none";
      weapon.visible = false;
    }

    function stopAiming() {
      if (!isAiming && !scope.classList.contains("active")) return;
      isAiming = false;
      camera.fov = 75;
      camera.updateProjectionMatrix();
      scope.classList.remove("active");
      crosshair.style.display = "";
      weapon.visible = true;
    }

    function showOverlay(title, copy, buttonText) {
      overlayTitle.textContent = title;
      overlayCopy.innerHTML = copy;
      primaryAction.textContent = buttonText;
      overlay.style.display = "grid";
      hud.style.display = "none";
    }

    function enterPlaying(mouseLocked) {
      if (state !== "starting") return;
      state = "playing";
      fallbackAim = !mouseLocked;
      helpText.textContent = fallbackAim
        ? "WASD 移動 · 移動滑鼠瞄準 · 左鍵射擊（步槍按住連發） · 按住右鍵狙擊開鏡 · R 換彈 · 滾輪切槍 · Shift 衝刺 · Esc 暫停"
        : "WASD 移動 · 滑鼠瞄準 · 左鍵射擊（步槍按住連發） · 按住右鍵狙擊開鏡 · R 換彈 · 滾輪切槍 · Shift 衝刺 · Esc 暫停";
      overlay.style.display = "none";
      hud.style.display = "block";
    }

    function requestGamePointerLock() {
      state = "starting";
      if (!renderer.domElement.requestPointerLock) {
        enterPlaying(false);
        return;
      }

      const request = renderer.domElement.requestPointerLock();
      if (request && typeof request.catch === "function") {
        request.catch(() => enterPlaying(false));
      }
    }

    function addEnemy(x, z, health, speed) {
      const group = new THREE.Group();
      const addPart = (geometry, material, partX, partY, partZ) => {
        const part = new THREE.Mesh(geometry, material);
        part.position.set(partX, partY, partZ);
        part.castShadow = true;
        part.userData.enemyGroup = group;
        group.add(part);
      };

      addPart(enemyBodyGeometry, enemyMaterial, 0, 1.02, 0);
      addPart(enemyHeadGeometry, enemyMaterial, 0, 1.69, 0.015);
      addPart(enemyVisorGeometry, enemyVisorMaterial, 0, 1.73, 0.28);
      addPart(enemyArmorGeometry, enemyAccentMaterial, -0.48, 1.17, 0);
      addPart(enemyArmorGeometry, enemyAccentMaterial, 0.48, 1.17, 0);
      addPart(enemyLimbGeometry, enemyMaterial, -0.48, 0.74, 0);
      addPart(enemyLimbGeometry, enemyMaterial, 0.48, 0.74, 0);
      addPart(enemyLegGeometry, enemyMaterial, -0.2, 0.27, 0);
      addPart(enemyLegGeometry, enemyMaterial, 0.2, 0.27, 0);
      addPart(enemyChestLightGeometry, enemyChestLightMaterial, 0, 1.16, 0.27);
      group.position.set(x, 0, z);
      scene.add(group);
      enemies.push({ group, health, speed });
    }

    function clearEnemies() {
      for (const enemy of enemies) scene.remove(enemy.group);
      enemies.length = 0;
    }

    function startWave(waveNumber) {
      clearEnemies();
      wave = waveNumber;
      const config = waveConfigs[wave - 1];
      for (const [x, z] of spawnPoints.slice(0, config.enemyCount)) {
        addEnemy(x, z, config.enemyHealth, config.enemySpeed);
      }
      updateHud();
    }

    function beginGame() {
      player.health = 100;
      player.yaw = 0;
      player.pitch = 0;
      player.lastDamage = 0;
      camera.position.set(0, 1.65, arenaHalfSize * 0.5);
      camera.rotation.set(0, 0, 0);
      lastShot = 0;
      isFiring = false;
      isReloading = false;
      stopAiming();
      reloadingWeapons.fill(false);
      reloadTimers.forEach(timer => window.clearTimeout(timer));
      currentWeaponIndex = 0;
      weaponTypes.forEach((type, index) => {
        ammunition[index].magazine = type.magazine;
        ammunition[index].reserve = type.reserve;
      });
      updateWeaponModel();
      score = 0;
      wave = 0;
      startWave(1);
      overlay.style.display = "none";
      hud.style.display = "block";
      requestGamePointerLock();
    }

    function completeWave() {
      if (wave === waveConfigs.length) {
        endGame(true);
        return;
      }

      state = "intermission";
      isFiring = false;
      pressedKeys.clear();
      if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
      showOverlay(
        `第 ${wave} 波完成`,
        "下一波會有更多、更快的敵人。<br>生命值不會在波次間恢復。",
        `開始第 ${wave + 1} 波`
      );
    }

    function endGame(won) {
      state = won ? "won" : "lost";
      isFiring = false;
      if (document.pointerLockElement === renderer.domElement) document.exitPointerLock();
      showOverlay(
        won ? "競技場清空" : "任務失敗",
        won ? "你完成全部三波敵人，成功守住競技場！" : "生命值已歸零，再試一次吧。",
        "再玩一次"
      );
    }

    function shoot() {
      const now = performance.now();
      const type = weaponTypes[currentWeaponIndex];
      const ammo = ammunition[currentWeaponIndex];
      if (isReloading || now - lastShot < type.fireDelay) return;
      if (ammo.magazine <= 0) {
        reloadWeapon();
        return;
      }
      lastShot = now;
      ammo.magazine -= 1;
      updateWeaponHud();
      raycaster.setFromCamera(centerScreen, camera);
      const targets = enemies.flatMap(enemy => enemy.group.children);
      const hit = raycaster.intersectObjects([...worldBlockers, ...targets], false)[0];
      const muzzle = weapon.localToWorld(new THREE.Vector3(0, 0, type.id === "sniper" ? -0.72 : -0.58));
      const endpoint = hit
        ? hit.point.clone()
        : raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 32);
      createBulletEffect(muzzle, endpoint, type);
      if (!hit || !hit.object.userData.enemyGroup) return;

      const group = hit.object.userData.enemyGroup;
      const enemy = enemies.find(candidate => candidate.group === group);
      if (!enemy) return;
      enemy.health -= type.damage;
      enemy.group.scale.setScalar(enemy.health > 0 ? 1.08 : 1);
      window.setTimeout(() => {
        if (enemy.group.parent) enemy.group.scale.setScalar(1);
      }, 70);

      if (enemy.health <= 0) {
        scene.remove(enemy.group);
        enemies.splice(enemies.indexOf(enemy), 1);
        score += 100;
        updateHud();
        if (enemies.length === 0) completeWave();
      }
    }

    function createBulletEffect(origin, endpoint, type) {
      const direction = endpoint.clone().sub(origin);
      const distance = direction.length();
      if (distance === 0) return;
      direction.normalize();

      const group = new THREE.Group();
      const bullet = new THREE.Mesh(bulletGeometry, bulletMaterials.get(type.id));
      const trailGeometry = new THREE.BufferGeometry();
      trailGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
      const trail = new THREE.Line(trailGeometry, trailMaterials.get(type.id));
      trail.frustumCulled = false;
      group.add(bullet, trail);
      scene.add(group);
      bulletEffects.push({
        group,
        bullet,
        trailGeometry,
        origin: origin.clone(),
        direction,
        distance,
        elapsed: 0,
        duration: Math.max(distance / 90, 0.04)
      });
    }

    function updateBulletEffects(delta) {
      for (let index = bulletEffects.length - 1; index >= 0; index -= 1) {
        const effect = bulletEffects[index];
        effect.elapsed += delta;
        const progress = Math.min(effect.elapsed / effect.duration, 1);
        const traveled = effect.distance * progress;
        const position = effect.origin.clone().addScaledVector(effect.direction, traveled);
        const trailStart = effect.origin.clone().addScaledVector(
          effect.direction,
          Math.max(0, traveled - 0.7)
        );
        effect.bullet.position.copy(position);

        const positions = effect.trailGeometry.attributes.position.array;
        positions[0] = trailStart.x;
        positions[1] = trailStart.y;
        positions[2] = trailStart.z;
        positions[3] = position.x;
        positions[4] = position.y;
        positions[5] = position.z;
        effect.trailGeometry.attributes.position.needsUpdate = true;

        if (progress === 1) {
          scene.remove(effect.group);
          effect.trailGeometry.dispose();
          bulletEffects.splice(index, 1);
        }
      }
    }

    function reloadWeapon() {
      const type = weaponTypes[currentWeaponIndex];
      const ammo = ammunition[currentWeaponIndex];
      const weaponIndex = currentWeaponIndex;
      if (reloadingWeapons[weaponIndex] || ammo.magazine >= type.magazine || ammo.reserve <= 0) return;

      reloadingWeapons[weaponIndex] = true;
      isReloading = true;
      updateWeaponHud();
      reloadTimers[weaponIndex] = window.setTimeout(() => {
        const needed = type.magazine - ammo.magazine;
        const loaded = Math.min(needed, ammo.reserve);
        ammo.magazine += loaded;
        ammo.reserve -= loaded;
        reloadingWeapons[weaponIndex] = false;
        if (weaponIndex === currentWeaponIndex) {
          isReloading = false;
          updateWeaponHud();
        }
      }, type.reloadTime);
    }

    function switchWeapon(direction) {
      currentWeaponIndex = (currentWeaponIndex + direction + weaponTypes.length) % weaponTypes.length;
      isReloading = reloadingWeapons[currentWeaponIndex];
      updateWeaponModel();
    }

    function updatePlayer(delta) {
      const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
      const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
      const movement = new THREE.Vector3();
      if (pressedKeys.has("KeyW")) movement.add(forward);
      if (pressedKeys.has("KeyS")) movement.sub(forward);
      if (pressedKeys.has("KeyD")) movement.add(right);
      if (pressedKeys.has("KeyA")) movement.sub(right);
      if (movement.lengthSq() > 0) {
        movement.normalize();
        const speed = pressedKeys.has("ShiftLeft") || pressedKeys.has("ShiftRight") ? 8 : 5;
        moveWithArenaCollision(camera.position, movement.x * speed * delta, movement.z * speed * delta, 0.42);
      }
      camera.rotation.set(player.pitch, player.yaw, 0);
    }

    function updateEnemies(delta, now) {
      for (const enemy of enemies) {
        const towardPlayer = new THREE.Vector3(
          camera.position.x - enemy.group.position.x,
          0,
          camera.position.z - enemy.group.position.z
        );
        const distance = towardPlayer.length();
        if (distance > 1.35) {
          towardPlayer.normalize();
          moveWithArenaCollision(enemy.group.position, towardPlayer.x * enemy.speed * delta, towardPlayer.z * enemy.speed * delta, 0.48);
          enemy.group.rotation.y = Math.atan2(towardPlayer.x, towardPlayer.z);
        } else if (now - player.lastDamage > 850) {
          player.lastDamage = now;
          player.health = Math.max(0, player.health - 10);
          updateHud();
          if (player.health === 0) {
            endGame(false);
            return;
          }
        }
      }
    }

    function moveWithArenaCollision(position, deltaX, deltaZ, radius) {
      const arenaLimit = arenaHalfSize - 0.35 - radius;
      const nextX = position.x + deltaX;
      if (Math.abs(nextX) <= arenaLimit && isOutsideObstacles(nextX, position.z, radius)) {
        position.x = nextX;
      }

      const nextZ = position.z + deltaZ;
      if (Math.abs(nextZ) <= arenaLimit && isOutsideObstacles(position.x, nextZ, radius)) {
        position.z = nextZ;
      }
    }

    function isOutsideObstacles(x, z, radius) {
      return arenaObstacles.every(obstacle =>
        Math.abs(x - obstacle.x) >= obstacle.halfX + radius ||
        Math.abs(z - obstacle.z) >= obstacle.halfZ + radius
      );
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      sky.position.copy(camera.position);
      updateBulletEffects(delta);
      if (state === "playing") {
        updatePlayer(delta);
        updateEnemies(delta, performance.now());
        if (state === "playing" && isFiring && weaponTypes[currentWeaponIndex].id === "rifle") shoot();
      }
      renderer.render(scene, camera);
    }

    primaryAction.addEventListener("click", () => {
      if (state === "paused") {
        requestGamePointerLock();
      } else if (state === "intermission") {
        startWave(wave + 1);
        requestGamePointerLock();
      } else {
        beginGame();
      }
    });

    document.addEventListener("pointerlockchange", () => {
      if (document.pointerLockElement === renderer.domElement) {
        enterPlaying(true);
      } else if (state === "playing") {
        isFiring = false;
        stopAiming();
        fallbackAim = false;
        state = "paused";
        showOverlay("遊戲暫停", "按下繼續回到競技場。", "繼續遊戲");
      }
    });

    document.addEventListener("pointerlockerror", () => {
      enterPlaying(false);
    });

    document.addEventListener("mousemove", event => {
      if (state !== "playing") return;
      if (document.pointerLockElement !== renderer.domElement && !fallbackAim) return;
      player.yaw -= event.movementX * 0.002;
      player.pitch = THREE.MathUtils.clamp(player.pitch - event.movementY * 0.002, -1.45, 1.45);
    });

    document.addEventListener("mousedown", event => {
      if (event.button === 0 && state === "playing") {
        isFiring = true;
        shoot();
      }
      if (event.button === 2 && state === "playing") startAiming();
    });

    document.addEventListener("mouseup", event => {
      if (event.button === 0) isFiring = false;
      if (event.button === 2) stopAiming();
    });

    document.addEventListener("contextmenu", event => event.preventDefault());

    document.addEventListener("wheel", event => {
      if (state !== "playing") return;
      event.preventDefault();
      switchWeapon(event.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    document.addEventListener("keydown", event => {
      pressedKeys.add(event.code);
      if (["KeyW", "KeyA", "KeyS", "KeyD", "Space"].includes(event.code)) event.preventDefault();
      if (event.code === "KeyR" && state === "playing") reloadWeapon();
    });

    document.addEventListener("keyup", event => pressedKeys.delete(event.code));
    window.addEventListener("blur", () => {
      isFiring = false;
      pressedKeys.clear();
      stopAiming();
    });
    window.addEventListener("resize", resize);
    resize();
    animate();
  </script>
</body>
</html>
